name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  building-heights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/buildings/requirements.txt
      - run: python -m pip install -r scripts/buildings/requirements.txt
      - run: python -m unittest discover -s scripts/buildings -p test_buildings.py
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:dependencies
      - run: npm run check:presets
      - run: npm run build
      - run: npm run check:release
      - run: node scripts/package-site.mjs
      - run: node scripts/package-release.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            artifacts/browser-results/
            artifacts/browser-report/
          retention-days: 7
